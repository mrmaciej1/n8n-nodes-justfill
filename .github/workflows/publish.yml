# Publish from GitHub Actions with provenance, as required for n8n verification.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC permission is required to generate the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Use the npm version bundled with Node 20; it supports provenance.
      # Skip native dependency installation scripts: n8n-workflow is used for
      # types and tests, and the published package has no runtime dependencies.
      - run: npm ci --ignore-scripts

      # Build dist before publication; it is the only packaged code directory.
      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
