# Publish from GitHub Actions with provenance, as required for n8n verification.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC permission is required to generate the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Omit registry-url so setup-node does not create token authentication
      # settings that interfere with npm's OIDC authentication.

      # OIDC trusted publishing requires npm >=11.5.1 and Node >=22.14.0.
      - run: npm install --global npm@11.21.0

      # Skip native dependency installation scripts: n8n-workflow is used for
      # types and tests, and the published package has no runtime dependencies.
      - run: npm ci --ignore-scripts

      # Build dist and verify the node contract before publication.
      - run: npm test

      # npm obtains a short-lived token for this workflow through GitHub OIDC.
      - run: npm publish --provenance --access public --registry=https://registry.npmjs.org
